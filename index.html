function seedOfflineV3(){const existing=new Set(state.custom.filter(f=>typeof f[6]==='string'&&f[6].startsWith('Offline estimate')).map(f=>f[0]));let changed=false;for(const food of OFFLINE_V3){if(!existing.has(food[0])){state.custom.push([...food]);existing.add(food[0]);changed=true}}return changed}
function normalizeFoodV3(text){return String(text).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
const foodAliasesV3={5:'thunfisch',6:'eier',7:'molkenprotein proteinpulver',16:'reiswaffel',17:'tortilla',18:'banane',19:'apfel',20:'beeren tiefgekuehlt',21:'brokkoli',22:'gemuese',23:'karotten moehren',24:'orangensaft',25:'honig',26:'olivenoel',27:'erdnussbutter',28:'mandeln',30:'butter',31:'milch'};

function extras(){if(!Array.isArray(state.favorites))state.favorites=[];state.favorites=state.favorites.filter(i=>Number.isInteger(i)&&i>=0&&i<all().length);if(!state.shopping||typeof state.shopping!=='object'||Array.isArray(state.shopping))state.shopping={};if(!state.productMeta||typeof state.productMeta!=='object'||Array.isArray(state.productMeta))state.productMeta={};}
extras();function current(){if(!state.weeks[week])state.weeks[week]={types:[...state.types],logs:Array.from({length:7},()=>[]),targets:{weight:state.weight,kcal:state.kcal,pr:state.pr,fr:state.fr}};return state.weeks[week]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));saved=true}catch(e){saved=false}if($('save-status'))$('save-status').textContent=saved?'Saved on this browser':'Not saved automatically — export a backup';}
function commit(){persist();render()};function carbs(w=current()){let t=w.targets;return Math.max(0,(t.kcal-t.weight*(4*t.pr+9*t.fr))*7/4)};function target(d,w=current()){let t=w.targets,p=t.weight*t.pr,f=t.weight*t.fr,c=carbs(w)*SHARE[w.types[d]];return {p,f,c,k:4*p+4*c+9*f}};function totals(d,w=current()){return w.logs[d].reduce((r,x)=>{let f=all()[x.id],g=x.g/100;if(f){r.p+=f[2]*g;r.c+=f[3]*g;r.f+=f[4]*g;r.k+=(4*f[2]+4*f[3]+9*f[4])*g}return r},{p:0,c:0,f:0,k:0})};function add(i){if(all()[i]){current().logs[day].push({id:i,g:all()[i][5]});commit()}}
function metric(n,k,col,t,a,unit){let diff=t[k]-a[k],pct=t[k]>0?a[k]/t[k]*100:a[k]>0?100:0;return `<div class="metric"><small>${n}</small><div><strong>${fmt(a[k])}</strong> <small>/ ${fmt(t[k])} ${unit}</small></div><div class="bar"><i style="width:${Math.min(100,pct)}%;background:${col}"></i></div><small>${fmt(Math.abs(diff))} ${unit} ${diff>=0?'remaining':'over target'}</small></div>`};function foodCards(){return all().map((f,i)=>({f,i})).filter(({f,i})=>(cat==='All'||cat===f[1]||(cat==='Favorites'&&state.favorites.includes(i)))&&normalizeFoodV3(f[0]+' '+(foodAliasesV3[i]||'')).includes(normalizeFoodV3(search))).map(({f,i})=>`<div class="food" draggable="true" data-food="${i}"><div><b>${esc(f[0])}</b><br><small>${f[5]} g ${esc(f[6])}</small><br><small>P ${dec(f[2]*f[5]/100)} · C ${dec(f[3]*f[5]/100)} · F ${dec(f[4]*f[5]/100)}</small></div><div class="actions"><button class="favorite" data-fav="${i}" aria-label="Toggle favorite" aria-pressed="${state.favorites.includes(i)}">${state.favorites.includes(i)?'★':'☆'}</button><button class="plus" data-add="${i}" aria-label="Add ${esc(f[0])}">+</button></div></div>`).join('')||'<small>No matching foods.</small>'}
function render(){if(seedOfflineV3())persist();extras();stopScan();let w=current(),t=target(day),a=totals(day),dt=shift(week,day),ts=w.targets, sum=DAY.reduce((r,_,i)=>{let v=totals(i);for(let k of ['p','c','f','k'])r[k]+=v[k];return r},{p:0,c:0,f:0,k:0});let weights=DAY.map((_,i)=>state.weigh[shift(week,i)]).filter(v=>v!==undefined);let range=`${parse(week).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${parse(shift(week,6)).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;

async function lookup(searchType,page=1){if(online.busy)return;let query=$('product-query')?.value.trim()??online.query, mode=$('product-mode')?.value||'aldi',code=$('barcode')?.value.trim();if(searchType==='barcode'&&!/^\d{8,14}$/.test(code||'')){online.message='Enter the 8–14 digits printed below the barcode.';refreshOnline();return}if(searchType!=='barcode'&&Date.now()-online.lastSearch<6500){online.message='Please wait a few seconds between catalog searches.';refreshOnline();return}online.query=query;online.mode=searchType==='barcode'?'barcode':mode;online.page=page;online.busy=true;online.message='Looking up products…';online.results=[];online.count=0;refreshOnline();try{let url, data;if(searchType==='barcode'){url=API+'/api/v2/product/'+code+'.json?'+new URLSearchParams({fields:FIELDS});data=await getJSON(url);online.results=data.status===1?[productData(data.product)].filter(Boolean):[];online.count=online.results.length}else{online.lastSearch=Date.now();if(searchType==='browse'||!query){let p=new URLSearchParams({countries_tags_en:'germany',page:String(page),page_size:'24',fields:FIELDS,sort_by:'unique_scans_n'});if(mode==='aldi')p.set('stores_tags','aldi');if(mode.startsWith('brand:'))p.set('brands_tags',mode.slice(6).toLowerCase());url=API+'/api/v2/search?'+p}else{let p=new URLSearchParams({search_terms:query,search_simple:'1',action:'process',json:'1',page:String(page),page_size:'24',fields:FIELDS,sort_by:'unique_scans_n',tagtype_0:'countries',tag_contains_0:'contains',tag_0:'germany'});if(mode!=='all'){p.set('tagtype_1',mode==='aldi'?'stores':'brands');p.set('tag_contains_1','contains');p.set('tag_1',mode==='aldi'?'aldi':mode.slice(6))}url=API+'/cgi/search.pl?'+p}data=await getJSON(url);online.results=(data.products||[]).map(productData).filter(Boolean);online.count=Number(data.count)||0}online.message=online.results.length?`${online.results.length} products with complete macros on this page. Save or log any item.`:online.count?'No complete macro records function decodeLine(gray){let min=255,max=0;for(let v of gray){if(v<min)min=v;if(v>max)max=v}if(max-min<45)return null;let threshold=(min+max)/2,bits=Array.from(gray,v=>v<threshold?1:0);for(let reverse=0;reverse<2;reverse++){if(reverse)bits.reverse();let runs=[];for(let i=0;i<bits.length;){let j=i+1;while(j<bits.length&&bits[j]===bits[i])j++;runs.push({start:i,len:j-i,b:bits[i]});i=j}for(let i=0;i<runs.length-3;i++){let a=runs[i];if(!a.b||i<1||runs[i-1].len<3*a.len)continue;let mod=(a.len+runs[i+1].len+runs[i+2].len)/3;if(mod<1.1||[a.len,runs[i+1].len,runs[i+2].len].some(v=>Math.abs(v-mod)>mod*.65))continue;for(let count of [59,43]){let end=runs[i+count-1];if(!end||!end.b)continue;let width=end.start+end.len-a.start,size=count===59?95:67,step=width/size;if(Math.abs(step-mod)>mod*.45)continue;let pattern='';for(let k=0;k<size;k++)pattern+=bits[Math.min(bits.length-1,Math.floor(a.start+(k+.5)*step))];let result=decodeModules(pattern);if(result)return result}}}return null}
function decodeFrame(video,canvas){let w=Math.min(960,video.videoWidth),h=Math.round(video.videoHeight*w/video.videoWidth);if(!w||!h)return null;canvas.width=w;canvas.height=h;let c=canvas.getContext('2d',{willReadFrequently:true});c.drawImage(video,0,0,w,h);let data=c.getImageData(0,0,w,h).data;for(let y of [.35,.42,.5,.58,.65].map(v=>Math.floor(h*v))){let gray=new Uint8Array(w);for(let x=0;x<w;x++){let i=(y*w+x)*4;gray[x]=(data[i]*77+data[i+1]*150+data[i+2]*29)>>8}let code=decodeLine(gray);if(code)return code}return null}

function v4Data(){if(!state.v4||typeof state.v4!=='object'||Array.isArray(state.v4))state.v4={};let d=state.v4;if(!Array.isArray(d.meals))d.meals=[];d.meals=d.meals.filter(m=>m&&typeof m.name==='string'&&Array.isArray(m.items)&&m.items.length&&m.items.every(v4ValidItem));if(!d.prices||typeof d.prices!=='object'||Array.isArray(d.prices))d.prices={};return d}
function v4ValidItem(x){return x&&Number.isInteger(x.id)&&x.id>=0&&x.id<all().length&&validNumber(x.g,1,5000)}
function v4Macro(items){let a={p:0,c:0,f:0,k:0};for(let x of items){let f=all()[x.id];if(!f)continue;a.p+=f[2]*x.g/100;a.c+=f[3]*x.g/100;a.f+=f[4]*x.g/100}a.k=4*a.p+4*a.c+9*a.f;return a}
function v4MacroText(a){return `${fmt(a.k)} kcal · P ${dec(a.p)} · C ${dec(a.c)} · F ${dec(a.f)} g`}
function v4Options(selected,filter=''){let q=filter.toLowerCase().trim();return all().map((f,i)=>({f,i})).filter(({f,i})=>i===selected||!q||f[0].toLowerCase().includes(q)).map(({f,i})=>`<option value="${i}" ${i===selected?'selected':''}>${esc(f[0])}</option>`).join('')}
function v4TrendData(){const latest=dateKey(new Date()), entries=Object.entries(state.weigh).filter(([d,v])=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&d<=latest&&validNumber(v,40,250)).sort((a,b)=>a[0].localeCompare(b[0]));const mean=a=>a.length?a.reduce((s,x)=>s+x[1],0)/a.length:null;const windowAt=d=>entries.filter(([k])=>k>=shift(d,-6)&&k<=d);let last=windowAt(latest),prev=windowAt(shift(latest,-7)),avg=mean(last),prior=mean(prev),rate=last.length>=4&&prev.length>=4?prior-avg:null;let eta=null;if(avg!==null&&avg>state.goal&&rate!==null&&rate>=.1&&rate<=1.5){let days=Math.ceil((avg-state.goal)/rate*7);if(days<=730)eta=shift(latest,days)}const rolling=entries.map(([d])=>[d,mean(windowAt(d))]);return {entries,rolling,avg,prior,rate,eta,last,prev,latest}}
function v4TrendPanel(){let t=v4TrendData(),r=t.rate,goal=state.goal,raw=t.entries.slice(-90),roll=t.rolling.slice(-90),last=t.entries.at(-1);let chart='';if(raw.length>=2){let lo=Math.min(goal,...raw.map(x=>x[1]))-.5,hi=Math.max(goal,...raw.map(x=>x[1]))+.5;const start=Date.parse(raw[0][0]),end=Date.parse(raw.at(-1)[0]);const xx=d=>38+((Date.parse(d)-start)/Math.max(1,end-start))*282,yy=v=>15+(hi-v)/(hi-lo)*118;const path=a=>a.map(([d,v],i)=>`${i?'L':'M'}${xx(d).toFixed(1)} ${yy(v).toFixed(1)}`).join(' ');chart=`<svg viewBox="0 0 334 161" role="img" aria-label="Weight measurements and seven-day average" style="width:100%;max-height:240px"><line x1="38" y1="${yy(goal)}" x2="320" y2="${yy(goal)}" stroke="var(--orange)" stroke-dasharray="5 4"/><text x="2" y="${Math.max(12,yy(goal))}" font-size="10" fill="var(--muted)">${goal}</text><text x="2" y="16" font-size="10" fill="var(--muted)">${hi.toFixed(1)}</text><text x="2" y="135" font-size="10" fill="var(--muted)">${lo.toFixed(1)}</text><path d="${path(raw)}" fill="none" stroke="var(--muted)" stroke-width="1.4" opacity=".65"/><path d="${path(roll)}" fill="none" stroke="var(--green)" stroke-width="2.5"/>${raw.map(([d,v])=>`<circle cx="${xx(d)}" cy="${yy(v)}" r="2" fill="var(--muted)"/>`).join('')}<text x="38" y="153" font-size="10" fill="var(--muted)">${raw[0][0].slice(5)}</text><text x="320" y="153" text-anchor="end" font-size="10" fill="var(--muted)">${raw.at(-1)[0].slice(5)}</text></svg><small>Grey: daily weight · Green: trailing 7-day mean · Dashed: goal</small>`}else chart='<p><small>Record at least two morning weights to display a graph.</small></p>';let rate=r===null?'—':`${r>=0?'−':'+'}${Math.abs(r).toFixed(2)} kg/wk`, eta=t.avg!==null&&t.avg<=goal?'Goal reached on current average':t.eta?parse(t.eta).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'Not enough reliable trend data';return `<div class="v4-grid"><div class="v4-stat"><small>Latest weight</small><b>${last?dec(last[1])+' kg':'—'}</b><small>${last?last[0]:'No measurements'}</small></div><div class="v4-stat"><small>7-day average</small><b>${t.avg===null?'—':dec(t.avg)+' kg'}</b><small>${t.last.length}/7 readings</small></div><div class="v4-stat"><small>Weekly change</small><b>${rate}</b><small>${t.prev.length}/7 prior readings</small></div><div class="v4-stat"><small>Remaining to goal</small><b>${t.avg===null?'—':dec(Math.max(0,t.avg-goal))+' kg'}</b><small>Target ${goal} kg</small></div></div>${chart}<p><b>Projected goal:</b> ${esc(eta)}</p><small>Compared with the preceding 7 days; at least four measurements in each period. Projection assumes your recent rate continues and is withheld for unstable, non-decreasing or unusually fast trends. It is not a recommended weight-loss rate.</small>`}
function v4Remaining(){let t=target(day),a=totals(day);return {p:Math.max(0,t.p-a.p),c:Math.max(0,t.c-a.c),f:Math.max(0,t.f-a.f)}}
function v4Solve(ids,remaining,fraction){let target=['p','c','f'].map(k=>remaining[k]*fraction),scale=target.map(x=>Math.max(x,12)),columns=ids.map(id=>all()[id].slice(2,5).map(x=>x/100)),max=ids.map(id=>{let f=all()[id];return f[4]>=70?40:f[1]==='Fats'?100:/\bdry\b|\btrocken\b/i.test(f[6]+' '+f[0])?180:350});let x=ids.map(()=>0);let pred=[0,0,0];for(let pass=0;pass<120;pass++)for(let j=0;j<ids.length;j++){let col=columns[j],num=0,den=0;for(let k=0;k<3;k++){num+=col[k]*(target[k]-pred[k]+col[k]*x[j])/(scale[k]**2);den+=col[k]**2/(scale[k]**2)}let nx=den?Math.max(0,Math.min(max[j],num/den)):0;for(let k=0;k<3;k++)pred[k]+=col[k]*(nx-x[j]);x[j]=nx}let items=ids.map((id,i)=>({id,g:Math.min(max[i],Math.round(x[i]/5)*5)})).filter(v4ValidItem);return {items,goal:{p:target[0],c:target[1],f:target[2],k:4*target[0]+4*target[1]+9*target[2]}}}
function v4ProposalKey(){return JSON.stringify([v4Day(),v4Slots,v4Fraction,v4Remaining()])}
function v4Builder(){let rem=v4Remaining(),valid=v4Proposal&&v4Proposal.key===v4ProposalKey();let selected=valid?v4Proposal.items:[];return `<p><small>Choose 1–6 foods, then calculate portions from the remaining macros for the selected day. Suggestions use the library’s weighing basis and are capped to practical portions.</small></p><p><b>Remaining:</b> P ${dec(rem.p)} · C ${dec(rem.c)} · F ${dec(rem.f)} g</p><label>Search ingredient choices</label><input id="v4-ingredient-filter" placeholder="Filter by food name" value="${esc(v4MealSearch)}"><div id="v4-ingredient-list">${v4Slots.map((id,i)=>`<div class="v4-formrow"><select data-v4-slot="${i}" aria-label="Ingredient ${i+1}">${v4Options(id,v4MealSearch)}</select><button data-v4="remove-slot" data-i="${i}" ${v4Slots.length===1?'disabled':''}>×</button></div>`).join('')}</div><div class="row"><button data-v4="add-slot" ${v4Slots.length>=6?'disabled':''}>+ ingredient</button><label style="margin:0">Share of remaining macros</label><select id="v4-fraction">${[.25,.33,.5,.75,1].map(n=>`<option value="${n}" ${n===v4Fraction?'selected':''}>${Math.round(n*100)}%</option>`).join('')}</select></div><button class="primary v4-wide" data-v4="solve">Calculate meal portions</button>${valid?`<div class="v4-result"><b>Suggested meal</b>${selected.length?selected.map(x=>`<div class="row between"><span>${esc(all()[x.id][0])}<br><small>${esc(all()[x.id][6])}</small></span><b>${x.g} g</b></div>`).join(''):'<p>No positive portions fit these targets.</p>'}<p><b>${v4MacroText(v4Macro(selected))}</b></p><small>Requested share: ${v4MacroText(v4Proposal.goal)}. Exact targets may not be achievable with these ingredients or portion limits.</small>${selected.length?`<div class="row"><button class="primary" data-v4="apply">Add to today's log</button><button data-v4="save-proposal">Save as meal</button></div>`:''}</div>`:''}`}
function v4Prior(){let prev=shift(v4Day(),-1),w=state.weeks[monday(prev)],i=(parse(prev).getDay()+6)%7;return {prev,items:w?.logs?.[i]?.filter(v4ValidItem)||[]}}
function v4Meals(){let d=v4Data(),prior=v4Prior(),log=current().logs[day];return `<div class="v4-result"><b>Copy previous day</b><p><small>${esc(prior.prev)} · ${prior.items.length} entries${prior.items.length?' · '+v4MacroText(v4Macro(prior.items)):''}</small></p><div class="row"><button data-v4="copy-append" ${prior.items.length?'':'disabled'}>Append foods</button><button data-v4="copy-replace" ${prior.items.length?'':'disabled'}>Replace day's foods</button></div><small>Only food entries are copied, not weights or carb-day settings.</small></div><h3>Save selected foods as a meal</h3><input id="v4-meal-name" placeholder="e.g. Post-workout lunch" maxlength="80"><div class="v4-checklist">${log.length?log.map((x,i)=>`<label class="v4-check"><input type="checkbox" data-v4-meal-item="${i}" checked><span>${esc(all()[x.id][0])} · ${x.g} g</span></label>`).join(''):'<small>Log foods first, or save a suggestion in Meal builder.</small>'}</div><button class="primary" data-v4="save-selected" ${log.length?'':'disabled'}>Save meal</button><h3 style="margin-top:18px">Saved meals (${d.meals.length})</h3>${d.meals.length?d.meals.map((m,i)=>`<div class="v4-meal-row"><div><b>${esc(m.name)}</b><br><small>${m.items.length} ingredients · ${v4MacroText(v4Macro(m.items))}</small></div><div class="row"><button class="primary" data-v4="meal-add" data-i="${i}">+ Log</button><button data-v4="meal-delete" data-i="${i}">Delete</button></div></div>`).join(''):'<small>No saved meals yet.</small>'}`}
function v4Price(id){let p=v4Data().prices[id];return p&&validNumber(p.eur,.01,10000)&&validNumber(p.grams,1,100000)?p:null}
function v4Budget(){let data=v4Data(),amounts={};for(let log of current().logs)for(let x of log)if(v4ValidItem(x))amounts[x.id]=(amounts[x.id]||0)+x.g;let used=0,checkout=0,priced=0,rows=Object.entries(amounts).map(([id,g])=>{let p=v4Price(id),packs=p?Math.ceil(g/p.grams):null;if(p){used+=g/p.grams*p.eur;checkout+=packs*p.eur;priced++}return `<tr><td>${esc(all()[id][0])}</td><td>${fmt(g)} g</td><td>${p?v4Money(g/p.grams*p.eur):'—'}</td><td>${p?packs+' × '+v4Money(p.eur):'<button data-v4="price-select" data-i="'+id+'">Set price</button>'}</td></tr>`}).join('');let ranked=Object.keys(data.prices).map(id=>({id:Number(id),p:v4Price(id),f:all()[id]})).filter(x=>x.p&&x.f&&x.f[2]>0&&x.f[1]==='Protein').map(x=>({...x,cost:x.p.eur/(x.p.grams*x.f[2]/100)*100})).sort((a,b)=>a.cost-b.cost);let p=v4Price(v4PriceFood);return `<div class="v4-grid"><div class="v4-stat"><small>Food consumed / week</small><b>${v4Money(used)}</b><small>Priced foods only</small></div><div class="v4-stat"><small>Whole packs / week</small><b>${v4Money(checkout)}</b><small>Assumes no stock at home</small></div></div><p><small>${priced} of ${Object.keys(amounts).length} logged foods priced. Unpriced foods are excluded from totals. Costs are estimates from your own prices, not live Aldi prices.</small></p><div class="v4-result" id="v4-price-editor"><label>Find a food to price</label><input id="v4-price-filter" placeholder="Search food name" value="${esc(v4PriceSearch)}"><select id="v4-price-food" style="width:100%;margin-top:6px">${v4Options(v4PriceFood,v4PriceSearch)}</select><div class="v4-grid" style="margin:8px 0"><div><label>Package price (€)</label><input id="v4-price-eur" type="number" min=".01" max="10000" step=".01" value="${p?p.eur:''}" placeholder="2.49"></div><div><label>Package weight (g)</label><input id="v4-price-grams" type="number" min="1" max="100000" step="1" value="${p?p.grams:1000}"></div></div><div class="row"><button class="primary" data-v4="price-save">Save price</button>${p?'<button data-v4="price-remove">Remove price</button>':''}</div><small>For €/kg enter 1000 g. Match the price to the food’s raw/cooked/drained weighing basis.</small></div><h3>Weekly grocery breakdown</h3><div class="scroll"><table><thead><tr><th>Food</th><th>Amount</th><th>Used cost</th><th>Buy packs</th></tr></thead><tbody>${rows||'<tr><td colspan="4">Log or plan foods for this week first.</td></tr>'}</tbody></table></div><h3 style="margin-top:16px">Cheapest protein sources</h3><small>Ranked by cost per 100 g of actual protein, from your priced protein foods.</small>${ranked.length?ranked.slice(0,10).map(x=>`<div class="row between" style="margin-top:8px"><span>${esc(x.f[0])}</span><b>${v4Money(x.cost)}</b></div>`).join(''):'<p><small>Enter prices for protein foods to compare value.</small></p>'}`}
function v4Panel(){v4Data();let tabs=[['trend','Weight trend'],['builder','Meal builder'],['meals','Saved meals'],['budget','Grocery budget']];return `<section class="card" id="v4-tools"><div class="row between"><h2>Nutrition tools</h2><small>V4 · Offline</small></div><div class="v4-tabs">${tabs.map(([id,label])=>`<button class="${v4Tab===id?'primary':''}" data-v4="tab" data-tab="${id}">${label}</button>`).join('')}</div>${v4Note?`<p role="status" class="v4-note">${esc(v4Note)}</p>`:''}<div id="v4-body">${v4Tab==='trend'?v4TrendPanel():v4Tab==='builder'?v4Builder():v4Tab==='meals'?v4Meals():v4Budget()}</div></section>`}
function v4Refresh(){let x=$('v4-body');if(x)x.innerHTML=v4Tab==='trend'?v4TrendPanel():v4Tab==='builder'?v4Builder():v4Tab==='meals'?v4Meals():v4Budget()}
function v4Message(msg){v4Note=msg;render()}
function v4Append(items){current().logs[day].push(...items.map(x=>({id:x.id,g:x.g})));v4Proposal=null;commit()}
function v4SaveMeal(name,items){name=String(name||'').trim().slice(0,80);if(!name||!items.length){v4Message('Enter a meal name and select at least one food.');return}v4Data().meals.push({name,items:items.map(x=>({id:x.id,g:x.g}))});v4Note='Saved meal: '+name;commit()}
root.addEventListener('click',e=>{let b=e.target.closest('button[data-v4]');if(!b)return;let x=b.dataset,i=Number(x.i),d=v4Data();v4Note='';switch(x.v4){case'tab':v4Tab=x.tab;render();break;case'add-slot':if(v4Slots.length<6)v4Slots.push(0);v4Proposal=null;v4Refresh();break;case'remove-slot':if(v4Slots.length>1)v4Slots.splice(i,1);v4Proposal=null;v4Refresh();break;case'solve':{let ids=[...new Set(v4Slots)].filter(id=>all()[id]);v4Proposal={...v4Solve(ids,v4Remaining(),v4Fraction),key:v4ProposalKey()};v4Refresh();break}case'apply':if(v4Proposal?.key===v4ProposalKey()){v4Note='Suggested foods added.';v4Append(v4Proposal.items)}break;case'save-proposal':if(v4Proposal?.key===v4ProposalKey()){let name=prompt('Meal name','Suggested meal');if(name!==null)v4SaveMeal(name,v4Proposal.items)}break;case'save-selected':{let name=$('v4-meal-name').value;let items=[...root.querySelectorAll('[data-v4-meal-item]:checked')].map(el=>current().logs[day][+el.dataset.v4MealItem]).filter(v4ValidItem);v4SaveMeal(name,items);break}case'meal-add':if(d.meals[i]){v4Note='Meal added: '+d.meals[i].name;v4Append(d.meals[i].items)}break;case'meal-delete':if(d.meals[i]&&confirm('Delete this saved meal? Existing food logs will stay unchanged.')){d.meals.splice(i,1);commit()}break;case'copy-append':case'copy-replace':{let items=v4Prior().items;if(!items.length)break;if(x.v4==='copy-replace'){if(!confirm('Replace all foods on the selected day with the previous day?'))break;current().logs[day]=[]}else if(current().logs[day].length&&!confirm('Append previous day’s foods to the existing entries?'))break;v4Note='Previous day copied.';v4Append(items);break}case'price-select':v4PriceFood=i;v4PriceSearch='';v4Refresh();$('v4-price-editor')?.scrollIntoView({block:'nearest'});break;case'price-save':{let eur=Number($('v4-price-eur').value),grams=Number($('v4-price-grams').value);if(!validNumber(eur,.01,10000)||!validNumber(grams,1,100000)){v4Message('Enter a positive price and package weight.');break}d.prices[v4PriceFood]={eur,grams};v4Note='Price saved.';commit();break}case'price-remove':delete d.prices[v4PriceFood];v4Note='Price removed.';commit();break}});
root.addEventListener('change',e=>{let el=e.target;if(el.dataset.v4Slot!==undefined){v4Slots[+el.dataset.v4Slot]=Number(el.value);v4Proposal=null;v4Refresh()}if(el.id==='v4-fraction'){v4Fraction=Number(el.value);v4Proposal=null;v4Refresh()}if(el.id==='v4-price-food'){v4PriceFood=Number(el.value);v4Refresh()}});
root.addEventListener('input',e=>{let el=e.target;if(el.id==='v4-price-filter'){v4PriceSearch=el.value;$('v4-price-food').innerHTML=v4Options(v4PriceFood,v4PriceSearch)}if(el.id==='v4-ingredient-filter'){v4MealSearch=el.value;root.querySelectorAll('[data-v4-slot]').forEach(sel=>sel.innerHTML=v4Options(v4Slots[+sel.dataset.v4Slot],v4MealSearch))}});

seedOfflineV3();current();persist();render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script></body></html>
