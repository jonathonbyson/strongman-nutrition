5px;flex-wrap:wrap}.cats button{font-size:12px;padding:6px 10px;border-radius:20px}.cats .active{background:var(--green);color:var(--bg)}.foods{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:480px;overflow:auto}.food{border:1px solid var(--line);border-radius:10px;padding:9px;display:flex;align-items:center;justify-content:space-between;gap:5px;cursor:grab}.food b{font-size:13px}.plus{padding:4px 11px;font-size:20px;color:var(--green);background:var(--soft);flex-shrink:0}.drop{border:2px dashed var(--line);border-radius:10px;min-height:120px;padding:8px}.drop.hover{border-color:var(--green);background:var(--soft)}.empty{text-align:center;padding:32px 5px;color:var(--muted)}.entry{display:grid;grid-template-columns:minmax(0,1fr) 70px 55px 28px;align-items:center;gap:7px;padding:9px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:none}.entry input{padding:7px}.remove{border:0;padding:4px;font-size:19px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}td,th{text-align:right;padding:8px 5px;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}th{color:var(--muted);font-size:11px}details{margin-top:12px}summary{cursor:pointer;font-weight:650}details .settings{margin-top:10px}.notice{color:var(--orange);font-size:12px}.status{font-size:12px;color:var(--green)}@media(max-width:720px){.work{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.card{padding:12px}.foods{max-height:340px}.day{font-size:11px}.settings{gap:6px}button,input,select{font-size:14px}.entry{grid-template-columns:minmax(0,1fr) 65px 50px 26px}main{padding:15px 10px 35px}}

@media(max-width:720px){main{padding-top:max(15px,env(safe-area-inset-top));padding-bottom:calc(35px + env(safe-area-inset-bottom));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}input,select{font-size:16px}.plus{min-width:44px;min-height:44px}.remove{min-height:44px}.food{cursor:default}.entry{grid-template-columns:minmax(0,1fr) 65px 49px 32px}.day{min-height:65px}.cats button{min-height:38px}}

.catalog-controls{display:grid;grid-template-columns:1fr auto;gap:7px;margin:9px 0}.catalog-controls input{min-width:0}.catalog-results{display:grid;gap:7px;max-height:520px;overflow:auto}.product-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:10px}.product-row img{width:52px;height:64px;object-fit:contain;background:white;border-radius:6px}.product-row .no-photo{width:52px;height:52px;background:var(--soft);border-radius:6px}.product-row .row{gap:4px}.product-row button,.favorite{padding:6px 8px}.favorite{font-size:17px;color:var(--orange)}.food .actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.shop-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.shop-item input[type=checkbox]{width:22px;height:22px;flex-shrink:0}.shop-item span{flex:1}.shop-item.done span{text-decoration:line-through;color:var(--muted)}.shop-item button{padding:5px 9px}.catalog-link{color:var(--green)}#scan-video{width:100%;max-height:280px;background:#111;border-radius:10px}#scan-box[hidden]{display:none}.catalog-controls button{white-space:nowrap}.catalog-results button{min-height:38px}@media(max-width:500px){.product-row{grid-template-columns:44px minmax(0,1fr)}.product-row>div:last-child{grid-column:2}.product-row img{width:44px}.food .actions{flex-direction:column}.food .favorite{min-height:32px}}
</style></head><body><main id="app"><h1>Strongman food tracker</h1><p>Loading your tracker…</p></main><noscript>This tracker needs JavaScript enabled. Open the downloaded HTML in a browser.</noscript><script>
'use strict';
const $=id=>document.getElementById(id), root=$('app'), KEY='strongman-nutrition-html-v1';
const DAY=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'], TYPES=['Low','Medium','High'], SHARE=[.10,.16,.22], COLOR=['var(--green)','var(--blue)','var(--orange)'], CATS=['All','Protein','Carbs','Fats','Fruit & veg'];
// Name, category, protein/carbs/fat per 100g, default portion, weighing basis.
const FOODS=[['Magerquark','Protein',12,4,.3,250,''],['Skyr Natur','Protein',10,4,.5,250,''],['Chicken breast / Hähnchenbrust','Protein',23,0,2,200,'raw'],['Turkey breast / Pute','Protein',23,0,1.5,200,'raw'],['Lean beef mince / Rinderhack','Protein',21,0,5,200,'5% fat, raw'],['Tuna in water','Protein',25,0,1,150,'drained'],['Eggs','Protein',13,1,11,120,'without shell'],['Whey protein','Protein',78,7,6,30,'powder'],['Harzer Käse','Protein',30,0,.5,100,''],['Hüttenkäse','Protein',12.5,3,4,200,''],['Salmon / Lachs','Protein',20,0,13,150,'raw'],['Rice / Reis','Carbs',7,78,1,100,'dry'],['Haferflocken','Carbs',13,60,7,80,'dry'],['Pasta / Nudeln','Carbs',13,70,2,100,'dry'],['Potatoes / Kartoffeln','Carbs',2,15,.1,300,'raw'],['Wholegrain bread / Vollkornbrot','Carbs',9,40,3.5,100,''],['Rice cakes / Reiswaffeln','Carbs',8,81,3,30,''],['Wraps','Carbs',8,52,7,60,''],['Banana','Fruit & veg',1.1,20,.3,120,'peeled'],['Apple','Fruit & veg',.3,12,.2,150,''],['Frozen berries','Fruit & veg',1,7,.5,150,''],['Broccoli','Fruit & veg',3,4,.4,200,''],['Mixed vegetables','Fruit & veg',3,7,.5,200,''],['Carrots','Fruit & veg',.8,7,.2,150,''],['Orange juice','Carbs',.7,9,.2,250,'approx. ml'],['Honey','Carbs',0,80,0,20,''],['Olive oil','Fats',0,0,100,10,''],['Peanut butter','Fats',26,12,50,20,''],['Almonds','Fats',21,6,53,30,''],['Avocado','Fats',2,2,15,100,'edible portion'],['Butter','Fats',.5,.6,82,10,''],['Milk 1.5%','Protein',3.4,4.8,1.5,250,'approx. ml']];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>Math.round(x).toLocaleString('en-GB'), dec=x=>Number(x.toFixed(1));
function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};function parse(d){return new Date(d+'T12:00:00')};function shift(d,n){let x=parse(d);x.setDate(x.getDate()+n);return dateKey(x)};function monday(d){let x=parse(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return dateKey(x)};const today=dateKey(new Date());let week=monday(today),day=(parse(today).getDay()+6)%7;
const defaults=()=>({version:1,weight:98,goal:90,kcal:3000,pr:2.5,fr:.6,types:[1,0,1,0,1,2,0],weeks:{},custom:[],weigh:{}});let state=defaults(), saved=false, status='', cat='All', search='';
const validNumber=(v,min,max)=>typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;const validTypes=a=>Array.isArray(a)&&a.length===7&&a.filter(x=>x===0).length===3&&a.filter(x=>x===1).length===3&&a.filter(x=>x===2).length===1;
function validate(s){if(!s||s.version!==1||!validNumber(s.weight,40,250)||!validNumber(s.goal,40,250)||!validNumber(s.kcal,1500,6500)||!validNumber(s.pr,1,3.5)||!validNumber(s.fr,.5,2)||!validTypes(s.types)||!Array.isArray(s.custom)||!s.weeks||typeof s.weeks!=='object'||Array.isArray(s.weeks)||!s.weigh||typeof s.weigh!=='object'||Array.isArray(s.weigh))throw Error('Invalid tracker backup.');for(const f of s.custom){if(!Array.isArray(f)||typeof f[0]!=='string'||!CATS.slice(1).includes(f[1])||!f.slice(2,5).every(x=>validNumber(x,0,100))||f.slice(2,5).length!==3||f[2]+f[3]+f[4]>101||!validNumber(f[5],1,5000)||typeof f[6]!=='string')throw Error('Invalid custom food.')}for(const [k,w] of Object.entries(s.weeks)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!w||!validTypes(w.types)||!Array.isArray(w.logs)||w.logs.length!==7||!w.logs.every(l=>Array.isArray(l)&&l.every(x=>x&&Number.isInteger(x.id)&&x.id>=0&&x.id<FOODS.length+s.custom.length&&validNumber(x.g,1,5000))))throw Error('Invalid weekly log.');if(!w.targets||!validNumber(w.targets.weight,40,250)||!validNumber(w.targets.kcal,1500,6500)||!validNumber(w.targets.pr,1,3.5)||!validNumber(w.targets.fr,.5,2))throw Error('Invalid weekly targets.')}for(const [k,v] of Object.entries(s.weigh)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!validNumber(v,40,250))throw Error('Invalid weight log.')}return s}
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));saved=true}catch(e){status='Previous local data could not be loaded, or storage is unavailable. Import a backup if needed.'}
const all=()=>FOODS.concat(state.custom);
function extras(){if(!Array.isArray(state.favorites))state.favorites=[];state.favorites=state.favorites.filter(i=>Number.isInteger(i)&&i>=0&&i<all().length);if(!state.shopping||typeof state.shopping!=='object'||Array.isArray(state.shopping))state.shopping={};if(!state.productMeta||typeof state.productMeta!=='object'||Array.isArray(state.productMeta))state.productMeta={};}
extras();function current(){if(!state.weeks[week])state.weeks[week]={types:[...state.types],logs:Array.from({length:7},()=>[]),targets:{weight:state.weight,kcal:state.kcal,pr:state.pr,fr:state.fr}};return state.weeks[week]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));saved=true}catch(e){saved=false}if($('save-status'))$('save-status').textContent=saved?'Saved on this browser':'Not saved automatically — export a backup';}
function commit(){persist();render()};function carbs(w=current()){let t=w.targets;return Math.max(0,(t.kcal-t.weight*(4*t.pr+9*t.fr))*7/4)};function target(d,w=current()){let t=w.targets,p=t.weight*t.pr,f=t.weight*t.fr,c=carbs(w)*SHARE[w.types[d]];return {p,f,c,k:4*p+4*c+9*f}};function totals(d,w=current()){return w.logs[d].reduce((r,x)=>{let f=all()[x.id],g=x.g/100;if(f){r.p+=f[2]*g;r.c+=f[3]*g;r.f+=f[4]*g;r.k+=(4*f[2]+4*f[3]+9*f[4])*g}return r},{p:0,c:0,f:0,k:0})};function add(i){if(all()[i]){current().logs[day].push({id:i,g:all()[i][5]});commit()}}
function metric(n,k,col,t,a,unit){let diff=t[k]-a[k],pct=t[k]>0?a[k]/t[k]*100:a[k]>0?100:0;return `<div class="metric"><small>${n}</small><div><strong>${fmt(a[k])}</strong> <small>/ ${fmt(t[k])} ${unit}</small></div><div class="bar"><i style="width:${Math.min(100,pct)}%;background:${col}"></i></div><small>${fmt(Math.abs(diff))} ${unit} ${diff>=0?'remaining':'over target'}</small></div>`};function foodCards(){return all().map((f,i)=>({f,i})).filter(({f,i})=>(cat==='All'||cat===f[1]||(cat==='Favorites'&&state.favorites.includes(i)))&&f[0].toLowerCase().includes(search.toLowerCase())).map(({f,i})=>`<div class="food" draggable="true" data-food="${i}"><div><b>${esc(f[0])}</b><br><small>${f[5]} g ${esc(f[6])}</small><br><small>P ${dec(f[2]*f[5]/100)} · C ${dec(f[3]*f[5]/100)} · F ${dec(f[4]*f[5]/100)}</small></div><div class="actions"><button class="favorite" data-fav="${i}" aria-label="Toggle favorite" aria-pressed="${state.favorites.includes(i)}">${state.favorites.includes(i)?'★':'☆'}</button><button class="plus" data-add="${i}" aria-label="Add ${esc(f[0])}">+</button></div></div>`).join('')||'<small>No matching foods.</small>'}
function render(){extras();stopScan();let w=current(),t=target(day),a=totals(day),dt=shift(week,day),ts=w.targets, sum=DAY.reduce((r,_,i)=>{let v=totals(i);for(let k of ['p','c','f','k'])r[k]+=v[k];return r},{p:0,c:0,f:0,k:0});let weights=DAY.map((_,i)=>state.weigh[shift(week,i)]).filter(v=>v!==undefined);let range=`${parse(week).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${parse(shift(week,6)).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;
root.innerHTML=`<header class="row between"><div><div class="eyebrow">STRONGMAN / NUTRITION</div><h1>${ts.weight} → ${state.goal} kg</h1><p class="muted">Carb cycling · Aldi food library · Weekly food diary</p></div><div id="save-status" class="status">${saved?'Saved on this browser':'Not saved automatically — export a backup'}</div></header>${status?`<p class="notice">${esc(status)}</p>`:''}
<section class="card"><div class="row between"><h2>Weekly plan</h2><div class="row"><button data-action="prev" aria-label="Previous week">‹</button><b>${range}</b><button data-action="next" aria-label="Next week">›</button><button data-action="today">Today</button></div></div><div class="settings"><div><label>Plan weight (kg)</label><input data-setting="weight" type="number" min="40" max="250" step=".1" value="${ts.weight}"></div><div><label>Goal weight (kg)</label><input data-setting="goal" type="number" min="40" max="250" step=".1" value="${state.goal}"></div><div><label>Avg. kcal / day</label><input data-setting="kcal" type="number" min="1500" max="6500" step="50" value="${ts.kcal}"></div></div><div class="row between" style="margin-top:10px"><small>Protein <b>${dec(t.p)} g/day</b> · Fat <b>${dec(t.f)} g/day</b></small><small>Weekly carbs <b>${fmt(carbs())} g</b></small></div><details><summary>Advanced macro settings</summary><div class="settings"><div><label>Protein g/kg</label><input data-setting="pr" type="number" min="1" max="3.5" step=".1" value="${ts.pr}"></div><div><label>Fat g/kg</label><input data-setting="fr" type="number" min=".5" max="2" step=".1" value="${ts.fr}"></div></div><small>Changes apply to this week and new weeks; previous weeks keep their own targets. Fat at 0.6 g/kg is relatively low. 3,000 kcal is an unverified starting estimate.</small></details>${ts.kcal<=ts.weight*(4*ts.pr+9*ts.fr)?'<p class="notice">Calories are too low for these protein and fat targets. Increase the calorie target.</p>':''}<div class="days">${DAY.map((n,i)=>`<button class="day ${i===day?'active':''}" data-day="${i}"><b>${n}</b><small>${parse(shift(week,i)).getDate()}</small><span class="dot" style="background:${COLOR[w.types[i]]}"></span><span>${TYPES[w.types[i]]}</span><small>${fmt(target(i).c)}g</small></button>`).join('')}</div><small>3 low days (10% each) · 3 medium (16% each) · 1 high (22%).</small></section>
<section class="card"><div class="row between"><div><h2 style="margin-bottom:2px">${FULL[day]}, ${parse(dt).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</h2><small>${Math.round(SHARE[w.types[day]]*100)}% of weekly carbs</small></div><select id="day-type" aria-label="Carb day type">${TYPES.map((x,i)=>`<option value="${i}" ${w.types[day]===i?'selected':''}>${x} carb</option>`).join('')}</select></div><div class="metrics" style="margin-top:12px">${metric('Calories','k','var(--purple)',t,a,'kcal')}${metric('Protein','p','var(--green)',t,a,'g')}${metric('Carbs','c','var(--blue)',t,a,'g')}${metric('Fat','f','var(--orange)',t,a,'g')}</div><div class="row" style="margin-top:12px"><label for="weigh" style="margin:0">Morning weight (kg)</label><input id="weigh" type="number" min="40" max="250" step=".1" style="width:95px" placeholder="–" value="${state.weigh[dt]??''}"><small>Optional · recorded by date</small></div></section>
${catalogPanel()}<div class="work"><section class="card"><div class="row between"><h2>Aldi food library</h2><small>${all().length} foods</small></div><input id="search" placeholder="Search food…" value="${esc(search)}"><div class="cats">${[...CATS,'Favorites'].map(c=>`<button data-cat="${c}" class="${cat===c?'active':''}">${c}</button>`).join('')}</div><div class="foods" id="foods">${foodCards()}</div><p><small>Tap + or drag into your log. Adjust the portion after adding.</small></p><details><summary>Add a custom food</summary><p><input id="new-name" placeholder="Food name"></p><div class="settings">${['Protein','Carbs','Fat'].map((x,i)=>`<div><label>${x} / 100 g</label><input id="new-${i}" type="number" min="0" max="100" step=".1" value="0"></div>`).join('')}</div><div class="row" style="margin-top:8px"><select id="new-cat">${CATS.slice(1).map(c=>`<option>${c}</option>`).join('')}</select><button class="primary" data-action="custom">Add to library</button></div><small id="error" class="notice"></small></details></section>
<section class="card"><div class="row between"><h2>Food log</h2><small>${w.logs[day].length} entries</small></div><div id="drop" class="drop">${w.logs[day].length?w.logs[day].map((x,i)=>{let f=all()[x.id];return `<div class="entry"><div><b>${esc(f[0])}</b><br><small>P ${dec(f[2]*x.g/100)} · C ${dec(f[3]*x.g/100)} · F ${dec(f[4]*x.g/100)}</small></div><div><small>grams</small><input data-grams="${i}" type="number" min="1" max="5000" step="1" value="${x.g}" aria-label="Grams of ${esc(f[0])}"></div><small>${fmt((4*f[2]+4*f[3]+9*f[4])*x.g/100)} kcal</small><button class="remove" data-remove="${i}" aria-label="Remove ${esc(f[0])}">×</button></div>`}).join(''):'<div class="empty">Drop food here<br><small>or tap + in the library</small></div>'}</div><div class="row between" style="margin-top:10px"><small>Portions in grams.</small><button data-action="clear" ${w.logs[day].length?'':'disabled'}>Clear day</button></div></section></div>
<section class="card"><div class="row between"><h2>Weekly overview</h2><small>${weights.length?`Average morning weight: ${dec(weights.reduce((x,y)=>x+y,0)/weights.length)} kg (${weights.length} days)`:'No weight entries yet'}</small></div><div class="scroll"><table><thead><tr><th>Day</th><th>kcal / target</th><th>Protein / g</th><th>Carbs / g</th><th>Fat / g</th><th>Weight</th></tr></thead><tbody>${DAY.map((n,i)=>{let v=totals(i),g=target(i);return `<tr><td><span class="dot" style="background:${COLOR[w.types[i]]}"></span> ${n}</td><td>${fmt(v.k)} / ${fmt(g.k)}</td><td>${fmt(v.p)} / ${fmt(g.p)}</td><td>${fmt(v.c)} / ${fmt(g.c)}</td><td>${fmt(v.f)} / ${fmt(g.f)}</td><td>${state.weigh[shift(week,i)]??'–'}</td></tr>`}).join('')}<tr><td><b>Total</b></td><td><b>${fmt(sum.k)}</b></td><td>${fmt(sum.p)}</td><td>${fmt(sum.c)}</td><td>${fmt(sum.f)}</td><td>–</td></tr></tbody></table></div><p><small>All weeks are retained. Navigate with the arrows; a new week does not erase the previous week.</small></p></section>
${shoppingPanel()}<section class="card"><h2>Save & backup</h2><p>Data is stored locally in this browser, not on a server. Keep a JSON backup to move to another device or recover if browser storage is cleared.</p><div class="row"><button class="primary" data-action="export">Export backup</button><button data-action="import">Restore backup</button><input type="file" id="import-file" accept=".json,application/json" hidden></div><p><small>Use the installed home-screen app consistently. Storage can be lost if you clear website data or remove the app. Export backups regularly to Files or iCloud Drive. Browser and home-screen storage may be separate; restore a backup to transfer data.</small></p></section><footer class="muted">Food values are approximate, not verified against specific Aldi labels. Rice, oats and pasta are dry weights; meats and potatoes are raw. Energy is estimated using 4/4/9 kcal per gram. Actual labels may differ. Adjust targets based on weight trend, training and recovery.</footer>`;}
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let x=b.dataset;if(x.add!==undefined)return add(+x.add);if(x.day!==undefined){day=+x.day;return render()}if(x.cat!==undefined){cat=x.cat;return render()}if(x.remove!==undefined){current().logs[day].splice(+x.remove,1);return commit()}switch(x.action){case 'prev':week=shift(week,-7);return render();case 'next':week=shift(week,7);return render();case 'today':week=monday(dateKey(new Date()));day=(new Date().getDay()+6)%7;return render();case 'clear':if(confirm('Clear this day’s food log?')){current().logs[day]=[];commit()}break;case 'custom':{let n=$('new-name').value.trim(),v=[0,1,2].map(i=>Number($('new-'+i).value));if(!n||v.some(x=>!validNumber(x,0,100))||v.reduce((a,b)=>a+b,0)>101){$('error').textContent='Enter a valid food name and macros per 100 g.';break}state.custom.push([n,$('new-cat').value,...v,100,'custom']);cat='All';search='';commit();break}case 'export':{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='strongman-backup-'+dateKey(new Date())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case 'import':$('import-file').click();break}});

root.addEventListener('change',async e=>{let el=e.target,k=el.dataset.setting;if(k){let v=Number(el.value);if(validNumber(v,+el.min,+el.max)){state[k]=v;if(k!=='goal')current().targets[k]=v;commit()}else render();return}if(el.dataset.grams!==undefined){let v=Number(el.value);if(validNumber(v,1,5000)){current().logs[day][+el.dataset.grams].g=v;commit()}else render();return}if(el.id==='day-type'){let w=current(),n=+el.value,old=w.types[day];if(n!==old){let j=w.types.findIndex((v,i)=>v===n&&i!==day);w.types[j]=old;w.types[day]=n;state.types=[...w.types];commit()}return}if(el.id==='weigh'){let d=shift(week,day);if(el.value===''){delete state.weigh[d];commit()}else if(validNumber(+el.value,40,250)){state.weigh[d]=+el.value;commit()}else render();return}if(el.id==='import-file'&&el.files[0]){try{let s=validate(JSON.parse(await el.files[0].text()));if(confirm('Restore this backup? It replaces all current tracker data.')){state=s;extras();status='Backup restored.';commit()}}catch(err){status='Could not restore: '+err.message;render()}}});

const API='https://world.openfoodfacts.org', FIELDS='code,product_name_de,product_name,brands,stores,countries_tags,nutriments,image_front_small_url,quantity,last_modified_t';
let online={query:'',mode:'aldi',page:1,results:[],message:'Search German products or browse Aldi-related entries.',count:0,busy:false,lastSearch:0,request:0},scanStream=null,scanTimer=null,scanGeneration=0,scannerBusy=false;

function catalogPanel(){return `<section class="card"><div class="row between"><h2 style="margin:0">Online product library</h2><small>ALDI SÜD · Germany</small></div><p><small>Find products in Open Food Facts. Aldi tags and brand names are community-reported, not confirmed stock in Weinsberg. Imported foods stay in your personal library offline.</small></p><div class="row"><a class="catalog-link" href="https://www.aldi-sued.de/produkte" target="_blank" rel="noopener">Official Aldi products & offers</a><a class="catalog-link" href="https://www.aldi-sued.de/filialen/l/weinsberg/heilbronner-strasse-69/bg62" target="_blank" rel="noopener">Weinsberg branch</a></div><div class="catalog-controls"><input id="product-query" placeholder="e.g. Skyr, Haferflocken, Hähnchen" value="${esc(online.query)}"><button class="primary" data-online="search">Search</button></div><label for="product-mode">Product source filter</label><select id="product-mode" style="width:100%"><option value="aldi" ${online.mode==='aldi'?'selected':''}>Aldi-tagged products (Germany)</option><option value="all" ${online.mode==='all'?'selected':''}>All German products</option>${brandChoices.map(b=>`<option value="${esc('brand:'+b)}" ${online.mode==='brand:'+b?'selected':''}>Brand: ${esc(b)}</option>`).join('')}</select><div class="row" style="margin-top:8px"><button data-online="browse">Browse / refresh catalog</button><small>Live lookup, not live inventory</small></div><div class="catalog-controls"><input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Barcode / EAN (8–14 digits)"><button data-online="barcode">Look up</button></div><div class="row"><button data-online="scan">Scan with camera</button><button data-online="stop" id="stop-scan" hidden>Stop camera</button></div><div id="scan-box" hidden><video id="scan-video" autoplay muted playsinline></video><small id="scan-status">Hold the barcode horizontally, close to the camera.</small></div><p id="online-status" role="status"><small>${esc(online.message)}</small></p><div id="online-results" class="catalog-results">${resultCards()}</div><div class="row between" id="online-pages">${pageButtons()}</div><p><small>Source: <a class="catalog-link" href="https://world.openfoodfacts.org/" target="_blank" rel="noopener">Open Food Facts</a> (ODbL; product images CC BY-SA where available). Check packaging for accuracy. Requests send your search term or barcode to that service, not your food history.</small></p></section>`}
function safePhoto(url){try{let u=new URL(url);return u.protocol==='https:'&&['images.openfoodfacts.org','static.openfoodfacts.org'].includes(u.hostname)?u.href:''}catch{return ''}}
function productData(p){let n=p.nutriments||{},v=['proteins_100g','carbohydrates_100g','fat_100g'].map(k=>n[k]);if(v.some(x=>typeof x!=='number'||!validNumber(x,0,100))||v.reduce((a,b)=>a+b,0)>101)return null;let name=String(p.product_name_de||p.product_name||'').trim().slice(0,160),code=String(p.code||'');if(!name||!/^\d{8,14}$/.test(code))return null;let brand=String(p.brands||'').slice(0,100),group=v[2]*9>Math.max(v[0]*4,v[1]*4)?'Fats':v[0]>=v[1]?'Protein':'Carbs';return {code,name,brand,quantity:String(p.quantity||'').slice(0,60),store:String(p.stores||'').slice(0,100),photo:safePhoto(p.image_front_small_url),updated:Number(p.last_modified_t)||0,food:[name+(brand?' · '+brand:''),group,...v,100,'OFF barcode '+code]}}
function resultCards(){return online.results.map((p,i)=>`<article class="product-row">${p.photo?`<img src="${esc(p.photo)}" loading="lazy" alt="Product packaging" referrerpolicy="no-referrer">`:'<div class="no-photo"></div>'}<div><b>${esc(p.name)}</b><br><small>${esc([p.brand,p.quantity].filter(Boolean).join(' · '))}</small><br><small>100 g: P ${dec(p.food[2])} · C ${dec(p.food[3])} · F ${dec(p.food[4])}</small><br><small>${p.store?'Reported store: '+esc(p.store):'Store not reported'} · ${p.updated?new Date(p.updated*1000).toLocaleDateString('en-GB'):'update date unknown'} · <a href="https://world.openfoodfacts.org/product/${p.code}" target="_blank" rel="noopener">Source</a></small></div><div class="row"><button data-product="${i}" data-method="save">Save</button><button class="primary" data-product="${i}" data-method="log">+ Log</button></div></article>`).join('')}
function pageButtons(){if(!online.count||online.mode==='barcode')return '';return `<button data-online="prev" ${online.page<=1||online.busy?'disabled':''}>Previous</button><small>Page ${online.page} · ${fmt(online.count)} database matches</small><button data-online="next" ${online.page*24>=online.count||online.busy?'disabled':''}>More</button>`}
function refreshOnline(){if($('online-status'))$('online-status').innerHTML='<small>'+esc(online.message)+'</small>';if($('online-results'))$('online-results').innerHTML=resultCards();if($('online-pages'))$('online-pages').innerHTML=pageButtons()}
async function getJSON(url){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),18000);try{let res=await fetch(url,{signal:controller.signal,credentials:'omit'});if(!res.ok)throw Error('Database returned '+res.status);return await res.json()}finally{clearTimeout(timer)}}
async function lookup(searchType,page=1){if(online.busy)return;let query=$('product-query')?.value.trim()??online.query, mode=$('product-mode')?.value||'aldi',code=$('barcode')?.value.trim();if(searchType==='barcode'&&!/^\d{8,14}$/.test(code||'')){online.message='Enter the 8–14 digits printed below the barcode.';refreshOnline();return}if(searchType!=='barcode'&&Date.now()-online.lastSearch<6500){online.message='Please wait a few seconds between catalog searches.';refreshOnline();return}online.query=query;online.mode=searchType==='barcode'?'barcode':mode;online.page=page;online.busy=true;online.message='Looking up products…';online.results=[];online.count=0;refreshOnline();try{let url, data;if(searchType==='barcode'){url=API+'/api/v2/product/'+code+'.json?'+new URLSearchParams({fields:FIELDS});data=await getJSON(url);online.results=data.status===1?[productData(data.product)].filter(Boolean):[];online.count=online.results.length}else{online.lastSearch=Date.now();if(searchType==='browse'||!query){let p=new URLSearchParams({countries_tags_en:'germany',page:String(page),page_size:'24',fields:FIELDS,sort_by:'unique_scans_n'});if(mode==='aldi')p.set('stores_tags','aldi');if(mode.startsWith('brand:'))p.set('brands_tags',mode.slice(6).toLowerCase());url=API+'/api/v2/search?'+p}else{let p=new URLSearchParams({search_terms:query,search_simple:'1',action:'process',json:'1',page:String(page),page_size:'24',fields:FIELDS,sort_by:'unique_scans_n',tagtype_0:'countries',tag_contains_0:'contains',tag_0:'germany'});if(mode!=='all'){p.set('tagtype_1',mode==='aldi'?'stores':'brands');p.set('tag_contains_1','contains');p.set('tag_1',mode==='aldi'?'aldi':mode.slice(6))}url=API+'/cgi/search.pl?'+p}data=await getJSON(url);online.results=(data.products||[]).map(productData).filter(Boolean);online.count=Number(data.count)||0}online.message=online.results.length?`${online.results.length} products with complete macros on this page. Save or log any item.`:online.count?'No complete macro records on this page. Try More or a different search.':'No complete product found. Try All German products or enter the label using Add a custom food.'}catch(e){online.message='Online lookup unavailable. Check your connection or try later; saved foods still work offline.'}finally{online.busy=false;refreshOnline()}}
function importProduct(i,log){let p=online.results[i];if(!p)return;let id=all().findIndex(f=>f[6]==='OFF barcode '+p.code);if(id<0){id=all().length;state.custom.push(p.food);state.productMeta[id]={barcode:p.code,source:'Open Food Facts',updated:p.updated};}if(log){add(id)}else{online.message=p.name+' saved to your food library.';cat='All';search='';commit()}}
function shoppingItems(){const key=week;let list=state.shopping[key];if(!Array.isArray(list))state.shopping[key]=list=[];return list}
function shoppingPanel(){let items=shoppingItems();return `<section class="card"><h2>Weekly shopping list</h2><p><small>Use your logged or planned meals for this week to generate a grocery list. Quantities are totals in grams, not package counts. Existing manual items are retained.</small></p><div class="row"><button class="primary" data-shop="generate">Generate from this week's foods</button><button data-shop="copy">Copy list</button></div><div class="catalog-controls"><input id="shop-name" placeholder="Add groceries or notes"><button data-shop="add">Add</button></div>${items.map((x,i)=>`<div class="shop-item ${x.done?'done':''}"><input type="checkbox" data-shop-check="${i}" ${x.done?'checked':''} aria-label="Mark purchased"><span>${esc(x.name)}</span><button data-shop="remove" data-index="${i}" aria-label="Remove item">×</button></div>`).join('')||'<p><small>No items yet.</small></p>'}</section>`}
function generateShopping(){let old=shoppingItems(),amounts={};for(let log of current().logs)for(let x of log)amounts[x.id]=(amounts[x.id]||0)+x.g;let generated=Object.entries(amounts).map(([id,g])=>({name:all()[id][0]+' — '+fmt(g)+' g',id:Number(id),done:old.some(x=>x.id===Number(id)&&x.name===all()[id][0]+' — '+fmt(g)+' g'&&x.done)}));state.shopping[week]=old.filter(x=>x.id===undefined).concat(generated);commit()}
// Local EAN decoder for iPhone/Safari when BarcodeDetector is unavailable.
const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'], G=L.map(x=>x.split('').reverse().map(b=>b==='1'?'0':'1').join('')), R=L.map(x=>x.replace(/./g,b=>b==='1'?'0':'1')), PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function checkEAN(s){let n=0;for(let i=s.length-2,j=0;i>=0;i--,j++)n+=Number(s[i])*(j%2?1:3);return (10-n%10)%10===Number(s.at(-1))}
function decodeModules(bits){let size=bits.length,half=size===95?6:4,mid=3+half*7;if(bits.slice(0,3)!=='101'||bits.slice(mid,mid+5)!=='01010'||bits.slice(-3)!=='101')return null;let left='',right='',par='';for(let i=0;i<half;i++){let b=bits.slice(3+i*7,10+i*7),l=L.indexOf(b),g=G.indexOf(b);if(l>=0){left+=l;par+='L'}else if(g>=0&&half===6){left+=g;par+='G'}else return null;let r=R.indexOf(bits.slice(mid+5+i*7,mid+12+i*7));if(r<0)return null;right+=r}let first=half===6?PAR.indexOf(par):'';if(first===-1)return null;let result=String(first)+left+right;return checkEAN(result)?result:null}
function decodeLine(gray){let min=255,max=0;for(let v of gray){if(v<min)min=v;if(v>max)max=v}if(max-min<45)return null;let threshold=(min+max)/2,bits=Array.from(gray,v=>v<threshold?1:0);for(let reverse=0;reverse<2;reverse++){if(reverse)bits.reverse();let runs=[];for(let i=0;i<bits.length;){let j=i+1;while(j<bits.length&&bits[j]===bits[i])j++;runs.push({start:i,len:j-i,b:bits[i]});i=j}for(let i=0;i<runs.length-3;i++){let a=runs[i];if(!a.b||i<1||runs[i-1].len<3*a.len)continue;let mod=(a.len+runs[i+1].len+runs[i+2].len)/3;if(mod<1.1||[a.len,runs[i+1].len,runs[i+2].len].some(v=>Math.abs(v-mod)>mod*.65))continue;for(let count of [59,43]){let end=runs[i+count-1];if(!end||!end.b)continue;let width=end.start+end.len-a.start,size=count===59?95:67,step=width/size;if(Math.abs(step-mod)>mod*.45)continue;let pattern='';for(let k=0;k<size;k++)pattern+=bits[Math.min(bits.length-1,Math.floor(a.start+(k+.5)*step))];let result=decodeModules(pattern);if(result)return result}}}return null}
function decodeFrame(video,canvas){let w=Math.min(960,video.videoWidth),h=Math.round(video.videoHeight*w/video.videoWidth);if(!w||!h)return null;canvas.width=w;canvas.height=h;let c=canvas.getContext('2d',{willReadFrequently:true});c.drawImage(video,0,0,w,h);let data=c.getImageData(0,0,w,h).data;for(let y of [.35,.42,.5,.58,.65].map(v=>Math.floor(h*v))){let gray=new Uint8Array(w);for(let x=0;x<w;x++){let i=(y*w+x)*4;gray[x]=(data[i]*77+data[i+1]*150+data[i+2]*29)>>8}let code=decodeLine(gray);if(code)return code}return null}
function stopScan(){scanGeneration++;clearTimeout(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}scannerBusy=false;if($('scan-box'))$('scan-box').hidden=true;if($('stop-scan'))$('stop-scan').hidden=true}
async function startScan(){stopScan();let generation=scanGeneration;let video=$('scan-video');if(!navigator.mediaDevices?.getUserMedia){online.message='Camera unavailable. Enter the barcode manually.';refreshOnline();return}try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(generation!==scanGeneration){stream.getTracks().forEach(t=>t.stop());return}scanStream=stream;video.srcObject=stream;$('scan-box').hidden=false;$('stop-scan').hidden=false;await video.play();let detector=null;try{if('BarcodeDetector' in window)detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']})}catch{}let canvas=document.createElement('canvas'),prev='',hits=0;async function tick(){if(generation!==scanGeneration||!scanStream)return;let code='';try{if(detector){try{let b=await detector.detect(video);code=b[0]?.rawValue||''}catch{detector=null}}if(!code&&video.readyState>=2)code=decodeFrame(video,canvas)||''}catch{}if(generation!==scanGeneration)return;if(code&&code===prev)hits++;else{prev=code;hits=code?1:0}if(hits>=2){stopScan();$('barcode').value=code;lookup('barcode');return}scanTimer=setTimeout(tick,220)}tick()}catch(e){stopScan();online.message='Camera permission or scanning unavailable. Type the barcode instead.';refreshOnline()}}
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let x=b.dataset;if(x.fav!==undefined){let id=+x.fav;state.favorites=state.favorites.includes(id)?state.favorites.filter(i=>i!==id):state.favorites.concat(id);commit()}if(x.online){switch(x.online){case 'search':lookup('search');break;case 'browse':if($('product-query'))$('product-query').value='';lookup('browse');break;case 'barcode':stopScan();lookup('barcode');break;case 'scan':startScan();break;case 'stop':stopScan();break;case 'prev':lookup('search',Math.max(1,online.page-1));break;case 'next':lookup('search',online.page+1);break}}if(x.product!==undefined)importProduct(+x.product,x.method==='log');if(x.shop){if(x.shop==='generate')generateShopping();if(x.shop==='add'){let n=$('shop-name').value.trim();if(n){shoppingItems().push({name:n.slice(0,200),done:false});commit()}}if(x.shop==='remove'){shoppingItems().splice(+x.index,1);commit()}if(x.shop==='copy'){let txt=shoppingItems().map(x=>(x.done?'✓ ':'□ ')+x.name).join('\n');if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>prompt('Copy shopping list:',txt));else prompt('Copy shopping list:',txt)}}});
